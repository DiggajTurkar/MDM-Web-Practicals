<!DOCTYPE html>
<html><head>
    <title>Student Information Form</title>

</head>
<body><h2>Student Information</h2><form><table cellpadding="8"><tr><td>Student Name</td>

<td><input type="text" placeholder="Enter Name"></td>

</tr>
<tr>
    <td>Roll Number</td>

<td><input type="number"></td>

</tr>
<tr>
    <td>Course</td>

<td><input type="Course"></td>

</tr>
<tr>

<td>

    <input type="radio" name="g"> Male

    <input type="radio" name="g"> Female

</td>

</tr>
<tr>
    <td>Phone</td>

<td><input type="tel"></td>

</tr>
<tr>

</tr>

</tr>
</table>
</form>

</html>
