<!DOCTYPE html>
<html>
<head>
    <title>Student Study Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<div class="max-w-2xl mx-auto p-5">
    <div class="bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-3xl font-bold text-center text-blue-600">Student Study Planner</h1>
        <p class="text-center text-gray-500 mt-2">Organize your daily study tasks</p>

        <div class="flex gap-2 mt-6">
            <input id="taskInput" type="text" placeholder="Enter a study task"
                class="flex-1 border rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-400">
            <button onclick="addTask()"
                class="bg-blue-600 text-white px-5 rounded-lg hover:bg-blue-700">
                Add
            </button>
        </div>

        <div class="mt-5">
            <div class="flex justify-between mb-2">
                <span>Progress</span>
                <span id="progressText">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="bg-green-500 h-3 rounded-full w-0"></div>
            </div>
        </div>

        <div class="flex justify-between mt-5 text-sm">
            <span>Total: <b id="total">0</b></span>
            <span>Completed: <b id="completed">0</b></span>
        </div>

        <ul id="taskList" class="mt-5 space-y-3"></ul>
    </div>
</div>

<script>
let tasks = [];

function addTask() {
    let input = document.getElementById("taskInput");
    let text = input.value.trim();

    if (text === "") {
        alert("Please enter a task");
        return;
    }

    tasks.push({text: text, done: false});
    input.value = "";
    displayTasks();
}

function toggleTask(index) {
    tasks[index].done = !tasks[index].done;
    displayTasks();
}

function deleteTask(index) {
    tasks.splice(index, 1);
    displayTasks();
}

function displayTasks() {
    let list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        list.innerHTML += `
        <li class="flex items-center justify-between bg-gray-50 p-3 rounded-lg border">
            <div class="flex items-center gap-3">
                <input type="checkbox" ${task.done ? "checked" : ""}
                    onchange="toggleTask(${index})" class="w-5 h-5">
                <span class="${task.done ? "line-through text-gray-400" : ""}">
                    ${task.text}
                </span>
            </div>
            <button onclick="deleteTask(${index})"
                class="text-red-500 hover:text-red-700">
                Delete
            </button>
        </li>`;
    });

    let completed = tasks.filter(task => task.done).length;
    let progress = tasks.length ? Math.round((completed / tasks.length) * 100) : 0;

    document.getElementById("total").textContent = tasks.length;
    document.getElementById("completed").textContent = completed;
    document.getElementById("progressText").textContent = progress + "%";
    document.getElementById("progressBar").style.width = progress + "%";
}
</script>

</body>
</html>
