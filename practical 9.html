<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-200 min-h-screen p-5">

<div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-xl">

    <h1 class="text-3xl font-bold text-center text-purple-600 mb-6">
        Personal To-Do List
    </h1>

    <div class="flex gap-3 mb-4">
        <input id="task" type="text" placeholder="Enter task"
            class="flex-1 border p-2 rounded-lg">

        <input id="date" type="date"
            class="border p-2 rounded-lg">
    </div>

    <button onclick="addTask()"
        class="w-full bg-purple-600 text-white p-2 rounded-lg hover:bg-purple-700">
        + Add Task
    </button>

    <div class="flex justify-between items-center mt-5 mb-3">
        <p class="font-semibold">Tasks: <span id="count">0</span></p>

        <select onchange="filterTasks(this.value)"
            class="border p-2 rounded-lg">
            <option value="all">All</option>
            <option value="active">Active</option>
            <option value="completed">Completed</option>
        </select>
    </div>

    <ul id="list" class="space-y-3"></ul>

</div>

<script>
let tasks = [];

function addTask() {
    let text = document.getElementById("task").value.trim();
    let date = document.getElementById("date").value;

    if (!text) {
        alert("Enter a task!");
        return;
    }

    tasks.push({
        text: text,
        date: date,
        completed: false
    });

    document.getElementById("task").value = "";
    document.getElementById("date").value = "";

    showTasks();
}

function showTasks(filter = "all") {
    let list = document.getElementById("list");
    list.innerHTML = "";

    tasks.forEach((t, i) => {

        if (filter == "active" && t.completed) return;
        if (filter == "completed" && !t.completed) return;

        let li = document.createElement("li");

        li.className =
            "bg-gray-100 p-3 rounded-lg flex justify-between items-center";

        li.innerHTML = `
            <div>
                <p class="font-semibold ${t.completed ? 'line-through text-gray-400' : ''}">
                    ${t.text}
                </p>

                <p class="text-sm text-gray-500">
                    ${t.date ? "Due: " + t.date : "No date"}
                </p>
            </div>

            <div class="flex gap-2">
                <button onclick="completeTask(${i})"
                    class="bg-green-500 text-white px-2 py-1 rounded">
                    ✓
                </button>

                <button onclick="deleteTask(${i})"
                    class="bg-red-500 text-white px-2 py-1 rounded">
                    ✕
                </button>
            </div>
        `;

        list.appendChild(li);
    });

    document.getElementById("count").textContent = tasks.length;
}

function completeTask(i) {
    tasks[i].completed = !tasks[i].completed;
    showTasks();
}

function deleteTask(i) {
    tasks.splice(i, 1);
    showTasks();
}

function filterTasks(value) {
    showTasks(value);
}
</script>

</body>
</html>
